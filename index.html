<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 23rd Birthday, Vedu Dada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf4e8; --ivory:#fffaf0; --blush:#f6dfe0; --rose:#c98b94; --lav:#e9e1f1; --brown:#5a4036; --gold:#c9a257; --white:#fff;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Script","Bradley Hand",cursive;
  --shadow:0 18px 40px rgba(120,80,70,.22); --shadow-s:0 6px 16px rgba(120,80,70,.18);
  --gap:clamp(14px,3vw,28px); --t:.9s; --ease:cubic-bezier(.45,.05,.2,1);
  --w:min(88vw,420px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--serif);color:var(--brown);overflow:hidden;
  background:radial-gradient(circle at 20% 15%,var(--lav) 0,transparent 40%),radial-gradient(circle at 85% 90%,var(--blush) 0,transparent 45%),var(--cream);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky span{position:absolute;bottom:-5vh;color:var(--gold);opacity:0;animation:float linear infinite}
.sky span.h{color:var(--rose)}
@keyframes float{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.7}80%{opacity:.5}100%{transform:translateY(-110vh) translateX(20px) scale(1.1);opacity:0}}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--gap);padding-top:max(var(--gap),env(safe-area-inset-top));padding-bottom:max(var(--gap),env(safe-area-inset-bottom));z-index:2;transition:opacity 1s var(--ease),visibility 1s}
.scene.off{opacity:0;visibility:hidden}
h1{font-weight:600;font-size:clamp(2rem,8vw,3.6rem);line-height:1.15;max-width:14em}
.sub{font-family:var(--hand);font-size:clamp(1.5rem,5.5vw,2rem);margin:1.1rem 0 2rem;line-height:1.3;color:var(--rose)}
.btn{font-size:1.2rem;font-weight:600;padding:.9rem 2rem;min-height:48px;border-radius:99px;background:linear-gradient(135deg,var(--blush),#efc9cf);box-shadow:0 0 0 1px var(--gold) inset,0 0 22px rgba(201,162,87,.4),var(--shadow-s);transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--gold) inset,0 0 34px rgba(201,162,87,.65),var(--shadow-s)}
.btn:active{transform:scale(.95)}
.btn.small{font-size:1.05rem;padding:.6rem 1.5rem}
.deco{position:absolute;color:var(--gold);font-size:1.1rem;opacity:.8;animation:twinkle 3.5s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.8)}}
/* envelope */
.dim{position:fixed;inset:0;background:rgba(70,40,40,.45);opacity:0;pointer-events:none;transition:opacity 1s,backdrop-filter 1s;z-index:3}
.dim.on{opacity:1;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.stage{z-index:4;transition:opacity .8s var(--ease),visibility .8s}
.floaty{animation:breathe 5s ease-in-out infinite}
.stage.opening .floaty{animation:none}
@keyframes breathe{50%{transform:translateY(-8px)}}
.envwrap{transition:transform 1s var(--ease)}
.opening .envwrap{transform:translateY(8vh) scale(1.04)}
.env{position:relative;width:var(--w);height:calc(var(--w)*.66);perspective:900px;border:0;display:block;filter:drop-shadow(0 18px 24px rgba(120,80,70,.28))}
.env>*{position:absolute}
.back{inset:0;background:#f1d3d6;border-radius:6px}
.mini{left:6%;right:6%;top:6%;height:88%;background:var(--ivory);border-radius:4px;z-index:2;transition:transform 1.1s var(--ease);box-shadow:var(--shadow-s)}
.mini::after{content:"";position:absolute;inset:14px;background:repeating-linear-gradient(transparent 0 15px,rgba(201,139,148,.35) 15px 16px)}
.rise .mini{transform:translateY(-68%)}
.pocket{inset:0;z-index:3;border-radius:6px;background:linear-gradient(160deg,#fffaf0,#f8ebdd)}
.pocket{clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.edge{inset:0;z-index:3;pointer-events:none}
.flap{left:0;right:0;top:0;height:56%;z-index:5;transform-origin:top;transform-style:preserve-3d;transition:transform var(--t) var(--ease),z-index 0s .45s;background:linear-gradient(#fffaf0,#f3d9d9);clip-path:polygon(0 0,100% 0,50% 100%)}
.flap.open{transform:rotateX(180deg);z-index:1;background:linear-gradient(#efc9cf,#f6dfe0)}
.flap::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,var(--gold) 49.5%,transparent 50.5%);opacity:.0}
.seal{left:50%;top:56%;width:48px;height:48px;margin:-24px 0 0 -24px;z-index:6;border-radius:50%;display:grid;place-items:center;color:#fff8e6;font-size:1.3rem;background:radial-gradient(circle at 35% 30%,#ecd28e,var(--gold) 60%,#a98138);box-shadow:0 3px 8px rgba(90,60,30,.4);transition:transform .7s var(--ease),opacity .6s}
.seal.broken{transform:scale(1.6) rotate(25deg);opacity:0}
.addr{left:0;right:0;top:66%;z-index:6;text-align:center;font-size:clamp(1.3rem,5.5vw,1.8rem);font-weight:600;transition:opacity .5s}
.hint{left:0;right:0;top:82%;z-index:6;text-align:center;font-family:var(--hand);font-size:clamp(1.1rem,4.5vw,1.4rem);color:var(--rose);transition:opacity .5s}
.opening .addr,.opening .hint{opacity:0}
.env:hover{filter:drop-shadow(0 22px 28px rgba(120,80,70,.35))}
.env:disabled{cursor:default}
/* letter */
.sheet{position:fixed;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;padding:max(20px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom));visibility:hidden;opacity:0;transition:opacity .6s;-webkit-overflow-scrolling:touch}
.sheet.show{visibility:visible;opacity:1}
.sheet::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,226,170,.55),transparent 60%);pointer-events:none}
.paper{position:relative;max-width:600px;margin:0 auto;padding:clamp(28px,7vw,56px) clamp(22px,6vw,52px);background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0)),var(--ivory);border-radius:10px 16px 12px 18px;box-shadow:var(--shadow),0 0 60px rgba(255,214,150,.45);transform-origin:top center;transform:scaleY(.15);opacity:0}
.paper::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(150,110,80,.12) 1px,transparent 1px);background-size:7px 7px}
.paper::after{content:"";position:absolute;inset:8px;border:1px dashed rgba(201,162,87,.55);border-radius:8px;pointer-events:none}
.show .paper{animation:unfold 1.3s var(--ease) forwards}
.folding .paper{animation:fold .9s var(--ease) forwards}
@keyframes unfold{0%{transform:translateY(40px) scaleY(.15);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
@keyframes fold{0%{transform:none;opacity:1}100%{transform:translateY(60px) scaleY(.1);opacity:0}}
.n23{position:absolute;right:18px;top:6px;font-family:var(--hand);font-size:4.2rem;color:var(--rose);opacity:.2;transform:rotate(8deg);pointer-events:none}
.sprig{display:block;margin:0 auto 6px;width:120px;color:var(--rose)}
.to{font-family:var(--hand);font-size:clamp(2rem,7vw,2.6rem);color:var(--rose);margin-bottom:1.2rem;position:relative}
.p{font-family:var(--hand);font-size:clamp(1.45rem,5.2vw,1.8rem);line-height:1.45;margin-bottom:1.1rem;position:relative;overflow-wrap:anywhere;opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s}
.show .p{opacity:1;transform:none;transition-delay:calc(var(--i)*.35s + 1s)}
.folding .p{opacity:0;transition-delay:0s}
.line{display:block;margin:1.4rem auto .2rem;width:150px;color:var(--gold)}
.corner{position:absolute;color:var(--gold);font-size:1rem;opacity:.8}
.final{position:relative;max-width:600px;margin:0 auto;text-align:center;padding:2.2rem 10px 3rem;opacity:0;transform:translateY(16px);transition:opacity 1.4s,transform 1.4s}
.final.in{opacity:1;transform:none}
.final .a{font-family:var(--hand);font-size:clamp(1.7rem,6vw,2.2rem);color:var(--rose)}
.final .b{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:600;margin:.4rem 0 1rem;color:#fff8ea;text-shadow:0 1px 8px rgba(90,40,40,.5)}
.final .a{color:#fff3e6;text-shadow:0 1px 8px rgba(90,40,40,.5)}
.final .c{font-size:clamp(2.2rem,10vw,4rem);font-weight:600;line-height:1.1;color:#fff;text-shadow:0 2px 14px rgba(201,100,120,.8),0 0 30px rgba(255,210,140,.8);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.final .deco{position:absolute}
.final .btn{margin-top:2rem}
.fade{opacity:0!important;transition:opacity .8s!important}
.cake{display:block;margin:.4rem auto 1.4rem;width:min(62vw,230px);min-height:48px;filter:drop-shadow(0 8px 14px rgba(90,40,40,.3));transition:transform .3s}
.cake:hover{transform:translateY(-3px)}.cake:active{transform:scale(.97)}
.cake svg{display:block;width:100%;height:auto;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite;transition:transform .5s,opacity .5s}
.flame:nth-of-type(2n){animation-delay:-.4s}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.9,1.12) rotate(3deg)}}
.glow{transition:opacity .5s}
.smoke{opacity:0;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round}
.out .flame,.out .glow{opacity:0;animation:none;transform:scale(.2)}
.out .smoke{animation:puff 2.2s ease-out forwards}
@keyframes puff{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
.wish{font-family:var(--hand);font-size:clamp(1.3rem,5vw,1.6rem);color:#fff3e6;text-shadow:0 1px 8px rgba(90,40,40,.5);margin:0 0 1.6rem;min-height:1.6em}
.final .c{margin-top:0}
.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important;transition-delay:0s!important}
  .sky{display:none}
}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<main>
<section class="scene" id="landing">
  <span class="deco" style="top:14%;left:12%">✦</span><span class="deco" style="top:22%;right:14%;animation-delay:1s">♡</span><span class="deco" style="bottom:16%;left:18%;animation-delay:2s">✧</span>
  <h1>Happy 23rd Birthday, Dada! ✨</h1>
  <p class="sub">To my forever Dada,<br>from your little Tanuu ♥️</p>
  <button class="btn" id="openBtn" type="button">Open Your Surprise ✨</button>
</section>

<section class="scene off" id="stage" aria-label="Envelope">
  <span class="deco" style="top:12%;left:10%">✦</span><span class="deco" style="top:18%;right:12%;animation-delay:1.2s">♡</span><span class="deco" style="bottom:14%;right:16%;animation-delay:2s">✧</span><span class="deco" style="bottom:20%;left:12%;animation-delay:.6s">✦</span>
  <div class="envwrap"><div class="floaty">
    <button class="env" id="env" type="button" aria-label="Open the envelope">
      <div class="back"></div>
      <div class="mini"></div>
      <div class="pocket"></div>
      <svg class="edge" viewBox="0 0 100 66" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 L50 37 L100 0 M0 66 L50 37 L100 66" fill="none" stroke="#c9a257" stroke-width=".5" vector-effect="non-scaling-stroke"/><rect x=".3" y=".3" width="99.4" height="65.4" fill="none" stroke="#c9a257" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
      <div class="flap" id="flap"></div>
      <div class="seal" id="seal">♥</div>
      <div class="addr">For My Dada 💗</div>
      <div class="hint">Open when you're ready...</div>
    </button>
  </div></div>
</section>
</main>
<div class="dim" id="dim"></div>

<div class="sheet" id="sheet" tabindex="-1" role="dialog" aria-label="Birthday letter from Tanuu">
  <article class="paper">
    <span class="n23" aria-hidden="true">23</span>
    <svg class="sprig" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M10 30 Q40 5 60 22 Q80 5 110 30"/><circle cx="60" cy="22" r="4"/><path d="M40 14 q-6-8 0-10 q6 2 0 10M80 14 q-6-8 0-10 q6 2 0 10"/><path d="M96 34v-8M100 34v-8M104 34v-8" stroke-width="2"/><path d="M96 24q0-3 0-3M100 24q0-3 0-3M104 24q0-3 0-3" stroke="#c9a257"/></svg>
    <span class="corner" style="left:16px;top:16px" aria-hidden="true">✦</span>
    <span class="corner" style="left:16px;bottom:16px" aria-hidden="true">♡</span>
    <span class="corner" style="right:16px;bottom:16px" aria-hidden="true">✧</span>
    <h2 class="to">To My Dearest Dada,</h2>
    <div id="letter"></div>
    <svg class="line" viewBox="0 0 150 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 14 Q25 4 45 14 T80 14"/><path d="M96 12 C96 6 104 6 106 11 C108 6 116 6 116 12 C116 18 106 22 106 22 C106 22 96 18 96 12Z" stroke="#c98b94"/></svg>
  </article>
  <div class="final" id="final">
    <span class="deco" style="left:6%;top:6%">✦</span><span class="deco" style="right:8%;top:14%;animation-delay:1s">♡</span><span class="deco" style="left:12%;bottom:30%;animation-delay:2s">✧</span><span class="deco" style="right:10%;bottom:34%;animation-delay:.5s">♡</span>
    <p class="a">Always your little Tanuu 💗</p>
    <p class="b">Happy Birthday, Vedu Dada ✨</p>
    <button class="cake" id="cake" type="button" aria-label="Blow out the candles">
      <svg viewBox="0 0 200 170" aria-hidden="true">
        <ellipse cx="100" cy="158" rx="92" ry="9" fill="#e9e1f1"/>
        <rect x="28" y="108" width="144" height="48" rx="10" fill="#e5aab3"/>
        <rect x="50" y="82" width="100" height="32" rx="9" fill="#f6dfe0"/>
        <path d="M50 92q8 10 16 0t16 0 16 0 16 0 16 0 16 0 8-4v-6H50z" fill="#fffaf0"/>
        <path d="M28 118q9 11 18 0t18 0 18 0 18 0 18 0 18 0 18 0v-6H28z" fill="#fffaf0"/>
        <text x="100" y="146" text-anchor="middle" font-family="Caveat,cursive" font-size="26" fill="#a9636e">23</text>
        <circle cx="46" cy="128" r="2" fill="#c9a257"/><circle cx="154" cy="128" r="2" fill="#c9a257"/>
        <rect x="59" y="62" width="6" height="26" rx="2" fill="#fff8ea" stroke="#c9a257" stroke-width=".8"/><path d="M59 70l6 3M59 78l6 3" stroke="#c98b94" stroke-width="1.2"/><circle class="glow" cx="62" cy="54" r="10" fill="#ffd98a" opacity=".35"/><path class="flame" d="M62 44c4 5 5 9 0 13c-5-4-4-8 0-13z" fill="#ffb84d"/><path class="smoke" d="M62 52c-4-5 4-8 0-13"/><rect x="78" y="62" width="6" height="26" rx="2" fill="#fff8ea" stroke="#c9a257" stroke-width=".8"/><path d="M78 70l6 3M78 78l6 3" stroke="#c98b94" stroke-width="1.2"/><circle class="glow" cx="81" cy="54" r="10" fill="#ffd98a" opacity=".35"/><path class="flame" d="M81 44c4 5 5 9 0 13c-5-4-4-8 0-13z" fill="#ffb84d"/><path class="smoke" d="M81 52c-4-5 4-8 0-13"/><rect x="97" y="62" width="6" height="26" rx="2" fill="#fff8ea" stroke="#c9a257" stroke-width=".8"/><path d="M97 70l6 3M97 78l6 3" stroke="#c98b94" stroke-width="1.2"/><circle class="glow" cx="100" cy="54" r="10" fill="#ffd98a" opacity=".35"/><path class="flame" d="M100 44c4 5 5 9 0 13c-5-4-4-8 0-13z" fill="#ffb84d"/><path class="smoke" d="M100 52c-4-5 4-8 0-13"/><rect x="116" y="62" width="6" height="26" rx="2" fill="#fff8ea" stroke="#c9a257" stroke-width=".8"/><path d="M116 70l6 3M116 78l6 3" stroke="#c98b94" stroke-width="1.2"/><circle class="glow" cx="119" cy="54" r="10" fill="#ffd98a" opacity=".35"/><path class="flame" d="M119 44c4 5 5 9 0 13c-5-4-4-8 0-13z" fill="#ffb84d"/><path class="smoke" d="M119 52c-4-5 4-8 0-13"/><rect x="135" y="62" width="6" height="26" rx="2" fill="#fff8ea" stroke="#c9a257" stroke-width=".8"/><path d="M135 70l6 3M135 78l6 3" stroke="#c98b94" stroke-width="1.2"/><circle class="glow" cx="138" cy="54" r="10" fill="#ffd98a" opacity=".35"/><path class="flame" d="M138 44c4 5 5 9 0 13c-5-4-4-8 0-13z" fill="#ffb84d"/><path class="smoke" d="M138 52c-4-5 4-8 0-13"/>
      </svg>
    </button>
    <p class="wish" id="wish" aria-live="polite">Make a wish, then tap the candles ✨</p>
    <p class="c">LOVE YOU FOREVER 💖</p>
    <button class="btn small" id="replay" type="button">Replay the Moment ✨</button>
  </div>
</div>

<script>
// ✏️ Edit the letter here. Each string is one paragraph, kept exactly as written.
const LETTER = [
  "On your 23rd birthday ,I just want to say….",
  "No matter how much we grow up you will be always my dada and I’ll be your little Tanuu ♥️",
  "Thank you for every laugh,every fight ,every memories and every moment we’ve shared ✨",
  "Your my biggest supporter dada ,I want u to be always with me 💗",
  "I hope Your 23rd year is filled with happiness,joy and,enjoyment,success and beautiful moments….",
  "May your every dream come true and get good health and stay always happy and always there be a cute smile on your face ☺️ may god bless you with everything u deserve bhai ✨",
  "I we’ll always pray from bottom of my heart for your best ever and forever ✨",
  "LOVE YOU VEDU DADA 💖",
  "~Your little sister Tanuu💗"
];

const $ = id => document.getElementById(id);
const K = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.05 : 1;
const wait = ms => new Promise(r => setTimeout(r, ms * K));

// letter paragraphs
$("letter").append(...LETTER.map((t, i) => {
  const p = document.createElement("p");
  p.className = "p"; p.style.setProperty("--i", i); p.textContent = t; return p;
}));

// soft particles
const sky = $("sky");
for (let i = 0; i < 16; i++) {
  const s = document.createElement("span");
  s.textContent = i % 3 === 0 ? "♥" : i % 3 === 1 ? "✦" : "·";
  if (i % 3 === 0) s.className = "h";
  s.style.cssText = `left:${Math.random()*100}%;font-size:${10+Math.random()*12}px;animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  sky.appendChild(s);
}

const stage = $("stage"), env = $("env"), sheet = $("sheet"), dim = $("dim"), fin = $("final");
let busy = false;

$("openBtn").addEventListener("click", () => {
  $("landing").classList.add("off");
  stage.classList.remove("off");
  setTimeout(() => env.focus({ preventScroll: true }), 900);
});

env.addEventListener("click", async () => {
  if (busy) return; busy = true; env.disabled = true;
  stage.classList.add("opening"); dim.classList.add("on");
  await wait(900); $("seal").classList.add("broken");
  await wait(600); $("flap").classList.add("open");
  await wait(1000); env.parentElement.parentElement.classList.add("rise");
  await wait(1200);
  stage.classList.add("off");
  sheet.scrollTop = 0;
  sheet.classList.add("show"); sheet.focus({ preventScroll: true });
  busy = false;
});

// reveal the final moment when reaching the bottom of the letter
new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) fin.classList.add("in"); }),
  { root: sheet, threshold: .35 }).observe(fin);


const cake = $("cake"), wish = $("wish"), WISH = wish.textContent;
cake.addEventListener("click", () => {
  if (cake.classList.contains("out")) return;
  cake.classList.add("out");
  wish.textContent = "May every wish come true, Dada 💗";
});

$("replay").addEventListener("click", async () => {
  if (busy) return; busy = true;
  fin.classList.add("fade");
  await wait(800);
  sheet.classList.add("folding");
  await wait(900);
  sheet.classList.remove("show", "folding");
  fin.classList.remove("in", "fade");
  cake.classList.remove("out"); wish.textContent = WISH;
  stage.classList.remove("off");
  await wait(700);
  env.parentElement.parentElement.classList.remove("rise");
  await wait(1200);
  $("flap").classList.remove("open");
  await wait(1000);
  $("seal").classList.remove("broken");
  stage.classList.remove("opening"); dim.classList.remove("on");
  env.disabled = false; env.focus({ preventScroll: true });
  busy = false;
});
</script>
</body>
</html>
